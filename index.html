<style>
:root{--bg:#f4f6fa;--card:#fff;--pri:#1f4e79;--pri2:#2e75b6;--ok:#2e7d32;--bad:#c62828;--line:#d9e1ec}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:#1b2733;font-size:14px}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
.btn{background:var(--pri2);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--pri2)}.btn.red{background:var(--bad)}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 16px;cursor:pointer;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;color:#455}
nav button.on{border-color:var(--pri2);color:var(--pri);font-weight:700}
main{padding:12px;max-width:1300px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border-radius:10px;padding:12px;border:1px solid var(--line)}
.card b{display:block;font-size:20px;margin-top:4px;color:var(--pri)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.tools input[type=search]{padding:7px;border:1px solid var(--line);border-radius:6px;min-width:200px}
.wrap{overflow:auto;max-height:68vh;background:#fff;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:700px}
th{background:var(--pri);color:#fff;position:sticky;top:0;padding:8px;font-weight:600;text-align:center;z-index:2;font-size:13px}
td{border-bottom:1px solid #eef2f7;padding:2px 3px}
td input,td select{width:100%;min-width:70px;border:1px solid transparent;background:transparent;padding:5px;font:inherit;border-radius:4px}
td input:focus,td select:focus{border-color:var(--pri2);background:#fff;outline:none}
td.c{background:#f1f6fc;text-align:center;padding:5px 8px;white-space:nowrap}
td.x{width:34px;text-align:center}
.neg{color:var(--bad);font-weight:700}.pos{color:var(--ok)}
tr.warn td.c.w{background:#fde8e8}
tr.stkd td{background:#fdf6ec}
td input.stkq{border:1px solid var(--line);background:#fff}
.note{background:#fff8e1;border:1px solid #f0d98a;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
tfoot td{background:#e8f0fa;font-weight:700;padding:6px 8px;position:sticky;bottom:0}
.sub{color:#567;font-size:12px}

/* print / PDF export */
@media print{.imp{display:none}
  body[data-psupp] .supsec{display:none}
  body[data-psupp] .supsec.keep{display:block}
  body[data-psupp] .supsum,body[data-psupp] .hp{display:none}
  header .hd-btns, nav, .tools, .x, #syncst, #loginOv{display:none !important}
  body{background:#fff;font-size:11px}
  main{padding:0;max-width:none}
  .wrap{max-height:none;overflow:visible;border:0}
  th{position:static;font-size:10px}
  td,th{border:1px solid #999 !important}
  td input,td select{border:0}
  #phead{display:block !important}
  .card b{font-size:14px}
}
#loginOv{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
#loginOv .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;width:320px;max-width:92vw}
#loginOv h2{margin:0 0 4px;color:var(--pri);font-size:18px}
#loginOv input{width:100%;padding:9px;margin:6px 0;border:1px solid var(--line);border-radius:6px;font:inherit}
#loginOv .err{color:var(--bad);font-size:13px;min-height:18px}
#passwordDialog{border:1px solid var(--line);border-radius:12px;padding:24px;width:380px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 32px);overflow:auto;color:var(--txt);background:#fff}
#passwordDialog::backdrop{background:rgba(15,23,42,.55)}
#passwordDialog h2{margin:0 0 8px;color:var(--pri);font-size:20px}
#passwordDialog label{display:block;font-size:14px;margin-top:12px}
#passwordDialog input{box-sizing:border-box;width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font:inherit;margin-top:5px}
#passwordDialog .pw-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#passwordMessage{min-height:20px;font-size:14px;margin:12px 0 0}
#passwordDialog button:disabled{opacity:.6;cursor:wait}
@media print{#passwordDialog{display:none!important}}
#syncst{font-size:12px;color:#cfe3f5}

// Calculation engine: mirrors the Excel formulas exactly.
function K(s){return String(s==null?'':s).toLowerCase();} // Excel lookups are case-insensitive, NOT trimmed
function N(x){x=parseFloat(x);return isNaN(x)?0:x;}
function calc(S){
  const inv=new Map();S.inventory.forEach(i=>{const k=K(i.name);if(!inv.has(k))inv.set(k,i);});
  const menu=new Map();S.menu.forEach(m=>{const k=K(m.name);if(!menu.has(k))menu.set(k,m);});
  // Sales rows: price = menu price, cost = menu cost * qty, profit = qty*price - cost
  const sales=S.sales.map(r=>{
    const m=r.product?menu.get(K(r.product)):null;
    if(!m)return {price:null,cost:null,profit:null,ok:!r.product};
    const q=N(r.qty);return {price:N(m.price),cost:N(m.cost)*q,profit:q*N(m.price)-N(m.cost)*q,ok:true};
  });
  const sold={};S.sales.forEach(r=>{if(r.product)sold[K(r.product)]=(sold[K(r.product)]||0)+N(r.qty);});
  // Purchases: unit price blank -> avg price from inventory; total = qty*price
  const purchases=S.purchases.map(r=>{
    const it=r.item?inv.get(K(r.item)):null;
    const price=(r.price===''||r.price==null)?(it?N(it.avg):0):N(r.price);
    return {price,total:r.item?N(r.qty)*price:null,ok:!r.item||!!it};
  });
  const bought={};S.purchases.forEach(r=>{if(r.item)bought[K(r.item)]=(bought[K(r.item)]||0)+N(r.qty);});
  // Recipe lines: cost = avg price (inventory) * qty ; unknown material -> 0
  const recipe=S.recipe.map(r=>{const it=inv.get(K(r.material));return {unit:it?it.unit:'',cost:it?N(it.avg)*N(r.qty):0,ok:!!it};});
  // Consumption of each material = sum(recipe qty * sold qty of that product)
  const cons={};S.recipe.forEach(r=>{const q=sold[K(r.product)]||0;if(q)cons[K(r.material)]=(cons[K(r.material)]||0)+N(r.qty)*q;});
  const inventory=S.inventory.map(i=>{
    const k=K(i.name);const p=bought[k]||0,c=cons[k]||0,bal=N(i.open)+p-c;
    return {purchased:p,consumed:c,balance:bal,value:bal*N(i.avg)};
  });
  // Recipe cost per product
  const prodCost={};S.recipe.forEach((r,idx)=>{prodCost[K(r.product)]=(prodCost[K(r.product)]||0)+recipe[idx].cost;});
  const menuOut=S.menu.map(m=>{const tax=N(m.tax);const margin=N(m.price)-N(m.cost)-(tax===0?0:tax);
    return {margin,pct:N(m.cost)?margin/N(m.cost):null,recipeCost:prodCost[K(m.name)]};});
  const avgMargin=menuOut.length?menuOut.reduce((a,b)=>a+b.margin,0)/menuOut.length:0;
  const products=[...new Set(S.recipe.map(r=>r.product))].map(p=>{
    const m=menu.get(K(p));const cost=prodCost[K(p)]||0;const price=m?N(m.price):0;
    return {product:p,cost,price,profit:price-cost,inMenu:!!m};});
  const tot={sales:0,cost:0,profit:0,purchases:0,invValue:0,qty:0,paySal:0,payAllow:0,payDed:0,payNet:0,supGoods:0,supPaid:0,supBal:0};
  sales.forEach((r,i)=>{if(r.price!=null){tot.sales+=N(S.sales[i].qty)*r.price;tot.cost+=r.cost;tot.profit+=r.profit;tot.qty+=N(S.sales[i].qty);}});
  purchases.forEach(r=>{if(r.total!=null)tot.purchases+=r.total;});
  inventory.forEach(r=>tot.invValue+=r.value);
  // Payroll: net due = salary + food/accommodation allowance - deduction
  const payroll=S.payroll.map(r=>{const net=N(r.salary)+N(r.allow)-N(r.ded);tot.paySal+=N(r.salary);tot.payAllow+=N(r.allow);tot.payDed+=N(r.ded);tot.payNet+=net;return {net};});
  // Suppliers: opening balance + goods received - paid, running balance in entry order
  const supNames=[...new Set(S.supOpen.map(o=>o.name).concat(S.supRows.map(r=>r.supplier)).filter(x=>x&&String(x).trim()))];
  const bal={};supNames.forEach(n=>{const o=S.supOpen.find(o2=>K(o2.name)===K(n));bal[K(n)]=N(o?o.open:0);});
  const supRows=S.supRows.map(r=>{const k=K(r.supplier);if(!(k in bal))bal[k]=0;bal[k]+=N(r.goods)-N(r.paid);tot.supGoods+=N(r.goods);tot.supPaid+=N(r.paid);return {bal:bal[k]};});
  const supSummary=supNames.map(n=>{const k=K(n);const o=S.supOpen.find(o2=>K(o2.name)===k);const open=N(o?o.open:0);let g=0,p=0;S.supRows.forEach(r=>{if(K(r.supplier)===k){g+=N(r.goods);p+=N(r.paid);}});return {name:n,open,goods:g,paid:p,bal:open+g-p};});
  tot.supBal=supSummary.reduce((a,x)=>a+x.bal,0);
  return {sales,purchases,recipe,inventory,menu:menuOut,avgMargin,products,tot,payroll,supRows,supSummary};
}

  const err=document.getElementById('lerr');err.textContent='';
  if(!em||!pw){err.textContent='اكتب اسم المستخدم وكلمة السر';return;}
  const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
  if(error){err.textContent='بيانات الدخول غلط أو في مشكلة اتصال';return;}
  user=data.user;await enterApp();
}
let passwordBusy=false;
function passwordMessage(text,ok=false){const el=document.getElementById('passwordMessage');el.textContent=text;el.style.color=ok?'var(--ok)':'var(--bad)';}
function openPasswordDialog(){
  if(!user)return;
  document.getElementById('passwordForm').reset();passwordMessage('');
  document.getElementById('passwordDialog').showModal();
  document.getElementById('currentPassword').focus();
}
function closePasswordDialog(){
  if(passwordBusy)return;
  document.getElementById('passwordForm').reset();passwordMessage('');
  document.getElementById('passwordDialog').close();
}
document.getElementById('passwordDialog').addEventListener('cancel',e=>{e.preventDefault();closePasswordDialog();});
async function changePassword(event){
  event.preventDefault();if(passwordBusy||!user)return;
  const current=document.getElementById('currentPassword').value;
  const next=document.getElementById('newPassword').value;
  const confirmation=document.getElementById('confirmPassword').value;
  passwordMessage('');
  if(!current||!next||!confirmation){passwordMessage('اكتب الباسورد الحالي والجديد والتأكيد');return;}
  if(next.length<8){passwordMessage('الباسورد الجديد لازم يكون 8 حروف أو أرقام على الأقل');return;}
  if(next!==confirmation){passwordMessage('الباسورد الجديد والتأكيد مش متطابقين');return;}
  if(next===current){passwordMessage('اختار باسورد جديد مختلف عن الحالي');return;}
  passwordBusy=true;
  const submit=document.getElementById('passwordSubmit'),cancel=document.getElementById('passwordCancel');
  submit.disabled=true;cancel.disabled=true;passwordMessage('جاري التحقق والحفظ...');
  try{
    // A separate, memory-only client checks the current password without replacing the app session.
    const verifier=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'cost-password-check'}});
    const check=await verifier.auth.signInWithPassword({email:user.email,password:current});
    if(check.error){passwordMessage(check.error.code==='invalid_credentials'?'الباسورد الحالي مش صحيح':'تعذر التحقق. راجع الاتصال وحاول تاني');return;}
    if(!check.data.user||check.data.user.id!==user.id){passwordMessage('تعذر التحقق من الحساب. سجّل دخولك تاني');return;}
    const {error}=await sb.auth.updateUser({password:next});
    if(error){
      const messages={weak_password:'الباسورد ضعيف. اختار باسورد أطول وأقوى',same_password:'اختار باسورد مختلف عن الحالي',reauthentication_needed:'محتاج تسجّل خروج وتدخل تاني قبل تغيير الباسورد',session_not_found:'الجلسة انتهت. سجّل دخولك تاني',over_request_rate_limit:'محاولات كتير. استنى شوية وحاول تاني'};
      passwordMessage(messages[error.code]||'الباسورد ما اتغيرش. راجع الاتصال وحاول تاني');return;
    }
    document.getElementById('passwordForm').reset();
    passwordMessage('تم تغيير الباسورد بنجاح ✓ استخدم الجديد في تسجيل الدخول بعد كده',true);
  }catch(e){passwordMessage('تعذر الاتصال. راجع الإنترنت وحاول تاني');}
  finally{passwordBusy=false;submit.disabled=false;cancel.disabled=false;}
}
async function signOut(){await sb.auth.signOut();user=null;location.reload();}
async function enterApp(){
  document.getElementById('loginOv').style.display='none';
  document.getElementById('changePasswordBtn').hidden=false;
  setSync('⏳ بيتم تحميل بياناتك...');
  await loadCloud();
  setSync('✓ محفوظ أونلاين');
  render();
}
async function boot(){
  const {data}=await sb.auth.getSession();
  if(data&&data.session){user=data.session.user;await enterApp();}
  else{document.getElementById('loginOv').style.display='flex';}
}

function importSupp(){
  const el=document.getElementById('impSupp');const t=el.value;if(!t||!t.trim())return;
  const num=v=>{v=String(v==null?'':v).replace(/[,\u066c]/g,'').trim();if(v==='')return '';const x=parseFloat(v);return isNaN(x)?'':x;};
  let n=0;
  t.split(/\r?\n/).forEach(line=>{if(!line.trim())return;const c=line.split('\t');
    S.supRows.push({date:String(c[0]||'').trim(),supplier:String(c[1]||'').trim(),doc:String(c[2]||'').trim(),note:String(c[3]||'').trim(),goods:num(c[4]),paid:num(c[5])});n++;});
  el.value='';save();render();alert('اتضافت '+n+' حركة');
}
function addSupRow(i){const n=supNamesList()[i];addRow('supRows',{date:today(),supplier:n||'',doc:'',note:'',goods:'',paid:''});setTimeout(()=>{const sec=document.getElementById('supsec'+i);if(sec)sec.scrollIntoView();},80);}
function printSupp(i){
  const sec=document.getElementById('supsec'+i);if(!sec)return;
  sec.classList.add('keep');document.body.setAttribute('data-psupp','1');
  document.getElementById('ptitle').textContent='نظام التكاليف والمخزون — كشف حساب مورد: '+supNamesList()[i];
  document.getElementById('pdate').textContent='تاريخ التصدير: '+today();
  const done=()=>{sec.classList.remove('keep');document.body.removeAttribute('data-psupp');};
  window.addEventListener('afterprint',done,{once:true});
  window.print();
  setTimeout(done,1500);
}
function supRowHtml(r,i,j,R){return `<tr>
   <td class="c">${j+1}</td>${inp('supRows',i,'date',r.date)}${inp('supRows',i,'supplier',r.supplier)}${inp('supRows',i,'doc',r.doc)}${inp('supRows',i,'note',r.note)}
   ${inp('supRows',i,'goods',r.goods,'n')}${inp('supRows',i,'paid',r.paid,'n')}
   <td class="c ${cls(R.supRows[i].bal)}">${nf(R.supRows[i].bal)}</td>${xbtn('supRows',i)}</tr>`;}
function supp(R){
  const sum=R.supSummary.map((x,i)=>`<tr><td>${esc(x.name)}</td><td><input type="number" step="any" value="${x.open}" onchange="setOpenI(${i},this.value)"></td><td>${nf(x.goods)}</td><td>${nf(x.paid)}</td><td class="${cls(x.bal)}">${nf(x.bal)}</td></tr>`).join('');
  const secs=R.supSummary.map((x,si)=>{
    const k=K(x.name);
    const items=S.supRows.map((r,i)=>({r,i})).filter(({r})=>K(r.supplier)===k&&match(r.date,r.supplier,r.doc,r.note));
    if(q&&!items.length)return '';
    const rows=items.map(({r,i},j)=>supRowHtml(r,i,j,R)).join('');
    return `<div class="supsec" id="supsec${si}">
    <h3>📄 كشف حساب: ${esc(x.name)} — الرصيد الحالي <span class="${cls(x.bal)}">${nf(x.bal)}</span></h3>
    <div class="tools">
     <span class="sub">الرصيد الافتتاحي</span><input type="number" step="any" style="width:110px;padding:6px;border:1px solid var(--line);border-radius:6px" value="${x.open}" onchange="setOpenI(${si},this.value)">
     <button class="btn" onclick="addSupRow(${si})">➕ إضافة حركة لـ${esc(x.name)}</button>
     <button class="btn sec" onclick="printSupp(${si})">🖨 PDF ${esc(x.name)}</button>
    </div>
    <div class="wrap"><table><thead><tr><th>#</th><th>التاريخ</th><th>المورد</th><th>رقم المستند</th><th>البيان</th><th>قيمة البضاعة المستلمة</th><th>المبلغ المدفوع</th><th>الرصيد بعد الحركة</th><th></th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td colspan="5">إجمالي ${esc(x.name)}</td><td>${nf(x.goods)}</td><td>${nf(x.paid)}</td><td class="${cls(x.bal)}">${nf(x.bal)}</td><td></td></tr></tfoot></table></div></div>`;
  }).join('');
  const blanks=S.supRows.map((r,i)=>({r,i})).filter(({r})=>!String(r.supplier||'').trim()&&match(r.date,r.supplier,r.doc,r.note));
  const blankSec=blanks.length?`<div class="supsec"><h3>📄 حركات بدون اسم مورد</h3>
   <p class="sub">اكتب اسم المورد في عمود المورد والحركة هتنتقل لكشفه تلقائي (ولو مورد جديد هيظهر له كشف مستقل).</p>
   <div class="wrap"><table><thead><tr><th>#</th><th>التاريخ</th><th>المورد</th><th>رقم المستند</th><th>البيان</th><th>قيمة البضاعة المستلمة</th><th>المبلغ المدفوع</th><th>الرصيد بعد الحركة</th><th></th></tr></thead>
   <tbody>${blanks.map(({r,i},j)=>supRowHtml(r,i,j,R)).join('')}</tbody></table></div></div>`:'';
  return `<p class="sub hp">كل مورد له كشف مستقل تحت: رصيده الافتتاحي وحركاته ورصيده الحالي. الرصيد الحالي = الافتتاحي + قيمة البضاعة المستلمة − المدفوع. الرصيد بعد الحركة بيتحسب بترتيب الإدخال (مش بترتيب التاريخ).</p>
  <div class="supsum"><h3>ملخص الموردين</h3>
  <div class="wrap"><table style="min-width:520px"><thead><tr><th>المورد</th><th>الرصيد الافتتاحي</th><th>إجمالي البضاعة</th><th>إجمالي المدفوع</th><th>الرصيد الحالي</th></tr></thead><tbody>${sum}</tbody>
  <tfoot><tr><td>إجمالي مديونية الموردين</td><td></td><td>${nf(R.tot.supGoods)}</td><td>${nf(R.tot.supPaid)}</td><td class="${cls(R.tot.supBal)}">${nf(R.tot.supBal)}</td></tr></tfoot></table></div></div>
  <h3 class="hp">كشوف حسابات الموردين</h3>${search()}
  <div class="tools"><button class="btn" onclick="addRow('supRows',{date:today(),supplier:'',doc:'',note:'',goods:'',paid:''})">➕ إضافة حركة</button></div>
  <details class="imp"><summary>📥 استيراد حركات من إكسل (لصق)</summary>
   <p class="sub">انسخ من إكسل بالترتيب: التاريخ، المورد، رقم المستند، البيان، قيمة البضاعة المستلمة، المبلغ المدفوع — والصق هنا (كل صف في سطر)، وبعدين اضغط استيراد. الصفوف بتتوزع تلقائي على كشف كل مورد حسب اسمه.</p>
   <textarea id="impSupp" rows="6" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:6px"></textarea>
   <div class="tools"><button class="btn" onclick="importSupp()">استيراد</button></div></details>
  ${secs||''}${blankSec}`;
}
function setStkI(i,v){const r=S.inventory[i];if(!r)return;const k=K(r.name);if(v===''||v==null)delete S.stk.counts[k];else S.stk.counts[k]=parseFloat(v);save();render(true);}
function clearStk(){if(!confirm('مسح كل الكميات الفعلية المدخلة في الجرد؟'))return;S.stk.counts={};save();render();}
function fillSys(){if(!confirm('نسخ رصيد النظام ككمية فعلية لكل الأصناف؟ (هيستبدل اللي اتكتب)'))return;const R=calc(S);S.inventory.forEach((r,i)=>{S.stk.counts[K(r.name)]=Math.round(R.inventory[i].balance*1e6)/1e6;});save();render();}
function applyStk(){
  const C=S.stk.counts||{};
  const keys=Object.keys(C).filter(k=>C[k]!==''&&C[k]!=null);
  if(!keys.length){alert('مفيش كميات فعلية مدخلة');return;}
  const R=calc(S);
  if(!confirm('اعتماد الجرد: هيتعدل رصيد أول المدة لـ '+keys.length+' صنف بحيث رصيد النظام يطابق الكمية الفعلية. متأكد؟'))return;
  S.inventory.forEach((r,i)=>{const k=K(r.name);if(C[k]!==''&&C[k]!=null){const diff=N(C[k])-R.inventory[i].balance;r.open=Math.round((N(r.open)+diff)*1e6)/1e6;}});
  S.stk.counts={};S.stk.date='';save();render();
}
function stk(R){
  const C=S.stk.counts||{};
  let shortV=0,overV=0,counted=0;
  S.inventory.forEach((r,i)=>{const k=K(r.name);const has=C[k]!==''&&C[k]!=null;if(has){counted++;const dv=(N(C[k])-R.inventory[i].balance)*N(r.avg);if(dv<0)shortV+=-dv;else overV+=dv;}});
  const rows=S.inventory.map((r,i)=>{
    const k=K(r.name), sys=R.inventory[i].balance;
    const has=C[k]!==''&&C[k]!=null;
    const diff=has?N(C[k])-sys:null, dv=has?diff*N(r.avg):null;
    if(!match(r.name,r.cat,r.code))return '';
    return `<tr${has&&diff!==0?' class="stkd"':''}><td class="c">${i+1}</td><td style="text-align:right">${esc(r.name)}</td><td class="c">${esc(r.unit)}</td>
     <td class="c">${nf(sys,3)}</td>
     <td><input class="stkq" type="number" step="any" value="${has?C[k]:''}" onchange="setStkI(${i},this.value)"></td>
     <td class="c ${cls(diff)}">${has?nf(diff,3):''}</td>
     <td class="c ${cls(dv)}">${has?nf(dv):''}</td></tr>`;
  }).join('');
  return `<p class="sub">عدّ الأصناف في المخزن واكتب الكمية الفعلية، والنظام يحسب الفرق وقيمته. الفرق = الفعلي − رصيد النظام: السالب عجز (هدر أو نقص)، والموجب زيادة. زر "اعتماد الفروقات" بيظبط المخزون على الفعلي.</p>${search()}
  <div class="tools">تاريخ الجرد: <input style="width:110px" value="${esc(S.stk.date||today())}" onchange="S.stk.date=this.value;save()">
  <button class="btn sec" onclick="fillSys()">⇪ نسخ رصيد النظام</button>
  <button class="btn" onclick="applyStk()">✔ اعتماد الفروقات وتسوية المخزون</button>
  <button class="btn red" onclick="clearStk()">🗑 مسح الجرد</button></div>
  <div class="cards">
  <div class="card">أصناف اتجرّدت<b>${counted} / ${S.inventory.length}</b></div>
  <div class="card">قيمة العجز (SAR)<b class="neg">${nf(shortV)}</b></div>
  <div class="card">قيمة الزيادة (SAR)<b>${nf(overV)}</b></div>
  <div class="card">صافي قيمة الفروق (SAR)<b class="${cls(overV-shortV)}">${nf(overV-shortV)}</b></div></div>
  <div class="wrap"><table><thead><tr><th>#</th><th>اسم المادة</th><th>الوحدة</th><th>رصيد النظام</th><th>الكمية الفعلية</th><th>الفرق</th><th>قيمة الفرق (SAR)</th></tr></thead><tbody>${rows}</tbody>
  <tfoot><tr><td colspan="6">صافي قيمة الفروقات</td><td class="${cls(overV-shortV)}">${nf(overV-shortV)}</td></tr></tfoot></table></div>`;
}
function printTab(){
  const names={dash:'الملخص',sales:'المبيعات',purch:'المشتريات',inv:'المخزون',stk:'الجرد الفعلي',recipe:'الريسيبي',menu:'المنيو',pay:'الرواتب',supp:'كشف حساب الموردين'};
  document.getElementById('ptitle').textContent='نظام التكاليف والمخزون — '+(names[tab]||'');
  document.getElementById('pdate').textContent='تاريخ التصدير: '+today();
  window.print();
}
boot();
</script></body></html>
